; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3]
; Unpinned espressif32 currently installs Arduino-ESP32 3.x, which this
; firmware does not build against. 6.13.0 ships Arduino core 2.0.17, the
; version required in docs/howto-compile.md.
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
build_flags = !echo '-fno-exceptions -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1 -D AG_LOG_LEVEL=AG_LOG_LEVEL_INFO -D ARDUINOJSON_ENABLE_PROGMEM=0 -D GIT_VERSION=\\"'$(git describe --tags --always --dirty)'\\"'
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
	aglib=symlink://${PROJECT_DIR}
	EEPROM
	WebServer
	ESPmDNS
	FS
	SPIFFS
	HTTPClient
	WiFiClientSecure
	Update
	DNSServer
	h2zero/NimBLE-Arduino@^2.1.0
	sensirion/Sensirion Core@^0.7.3
	sensirion/Sensirion UART SPS30@^1.0.0
	bblanchon/ArduinoJson@^7.4.3

; Modular outdoor harness, variant A.
; Schematic: hardware/modular/variant-a-esp32-d1mini/ (rev A, 2026-11-25).
; Board is the classic ESP32-WROOM-32 in a WEMOS D1 Mini ESP32 / LOLIN32-mini
; footprint. wemos_d1_mini32 matches that module; lolin_d32 is the same chip
; with a different silkscreen (IO numbers instead of D0/D1/D2/A0).
; Pins: SDA GPIO21 (D2), SCL GPIO22 (D1), SPS30 5V EN GPIO26 (D0),
; VBAT ADC GPIO36 (A0, ADC1_CH0). Divider is 2x 100k, so pack = pin * 2.
; I2C is 100 kHz (SPS30 maximum). Wire timeout 200 ms covers SCD30 stretch.
[env:modular-esp32-d1mini]
platform = espressif32@6.13.0
board = wemos_d1_mini32
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = !echo '-fno-exceptions -D AG_LOG_LEVEL=AG_LOG_LEVEL_INFO -D ARDUINOJSON_ENABLE_PROGMEM=0 -D I2C_SDA_PIN=21 -D I2C_SCL_PIN=22 -D SPS30_5V_EN_PIN=26 -D VBAT_ADC_PIN=36 -D I2C_CLOCK_HZ=100000 -D WIRE_TIMEOUT_MS=200 -D VBAT_DIVIDER_NUM=2 -D VBAT_DIVIDER_DEN=1 -D GIT_VERSION=\\"'$(git describe --tags --always --dirty)'\\"'
lib_deps =
	aglib=symlink://${PROJECT_DIR}
	EEPROM
	WebServer
	ESPmDNS
	FS
	SPIFFS
	HTTPClient
	WiFiClientSecure
	Update
	DNSServer
	h2zero/NimBLE-Arduino@^2.1.0
	sensirion/Sensirion Core@^0.7.3
	sensirion/Sensirion UART SPS30@^1.0.0
	bblanchon/ArduinoJson@^7.4.3

; Modular outdoor harness, variant B.
; Schematic: hardware/modular/variant-b-esp32s3-n16r8/ (rev A, 2026-11-25).
; ESP32-S3-DevKitC-1 class module N16R8: 16 MB quad SPI flash, 8 MB octal
; PSRAM (Espressif ESP32-S3-WROOM-1 datasheet). memory_type qio_opi matches
; that combination. GPIO35-37 (and 33-34) are not wired out to sensors.
; Pins: SDA GPIO8, SCL GPIO9, SPS30 5V EN GPIO7, VBAT ADC GPIO6 (ADC1_CH5).
; GPIO8/GPIO9 are the esp32s3 Arduino variant's default Wire pins.
; GPIO10 is that variant's default SPI SS, so the boost enable is GPIO7 instead.
; The stock devkitc-1 partition table in this repo is the 4 MB Open Air map;
; the rest of the 16 MB flash is left unused so the OTA layout stays put.
[env:modular-esp32s3-n16r8]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags = !echo '-fno-exceptions -D AG_LOG_LEVEL=AG_LOG_LEVEL_INFO -D ARDUINOJSON_ENABLE_PROGMEM=0 -D BOARD_HAS_PSRAM -D I2C_SDA_PIN=8 -D I2C_SCL_PIN=9 -D SPS30_5V_EN_PIN=7 -D VBAT_ADC_PIN=6 -D I2C_CLOCK_HZ=100000 -D WIRE_TIMEOUT_MS=200 -D VBAT_DIVIDER_NUM=2 -D VBAT_DIVIDER_DEN=1 -D GIT_VERSION=\\"'$(git describe --tags --always --dirty)'\\"'
lib_deps =
	aglib=symlink://${PROJECT_DIR}
	EEPROM
	WebServer
	ESPmDNS
	FS
	SPIFFS
	HTTPClient
	WiFiClientSecure
	Update
	DNSServer
	h2zero/NimBLE-Arduino@^2.1.0
	sensirion/Sensirion Core@^0.7.3
	sensirion/Sensirion UART SPS30@^1.0.0
	bblanchon/ArduinoJson@^7.4.3

[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
	aglib=symlink://${PROJECT_DIR}
	EEPROM
	ESP8266HTTPClient
	ESP8266WebServer
	DNSServer
;
monitor_filters = time

