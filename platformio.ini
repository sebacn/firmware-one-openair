; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3]
; Unpinned espressif32 currently installs Arduino-ESP32 3.x, which this
; firmware does not build against. 6.13.0 ships Arduino core 2.0.17, the
; version required in docs/howto-compile.md.
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
build_flags = !echo '-fno-exceptions -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1 -D AG_LOG_LEVEL=AG_LOG_LEVEL_INFO -D ARDUINOJSON_ENABLE_PROGMEM=0 -D GIT_VERSION=\\"'$(git describe --tags --always --dirty)'\\"'
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
	aglib=symlink://${PROJECT_DIR}
	EEPROM
	WebServer
	ESPmDNS
	FS
	SPIFFS
	HTTPClient
	WiFiClientSecure
	Update
	DNSServer
	h2zero/NimBLE-Arduino@^2.1.0
	sensirion/Sensirion Core@^0.7.3
	sensirion/Sensirion UART SPS30@^1.0.0
	bblanchon/ArduinoJson@^7.4.3

; Modular outdoor harness, variant A.
; Schematic: hardware/modular/variant-a-esp32-d1mini/ (rev C, 2026-11-26).
; The dev board is powered from its own USB connector. Header 5V (VBUS) feeds
; the SPS30. Header 3V3 (onboard LDO) feeds the I2C modules. There is no
; charger, buck-boost, battery pack, or VBAT divider, and no SPS30 power-switch
; GPIO. PlatformIO board lolin32. Arduino variant lolin32: SDA GPIO21, SCL GPIO22,
; LED_BUILTIN GPIO5 (active low). The same image is what modular-esp32-d1mini
; and modular-lolin32-lite build; an ESP32 D1 mini uses silkscreen 5V and 3V3
; with those same I2C pins.
; I2C is 100 kHz (SPS30 and SCD30 maximum). Wire timeout 200 ms covers SCD30 stretch.
; modular-lolin32, modular-lolin32-lite and modular-esp32-d1mini are the same image.
; AG_MODULAR_I2C selects SCD30/SCD41 and reads the SPS30 on I2C.
; SPS30_ALWAYS_ON=1 keeps the measurement running. The sensor stays powered
; because VDD is wired to the 5V pin. Do not define SPS30_5V_EN_PIN or
; VBAT_ADC_PIN for this sheet.
[env:modular-esp32-d1mini]
platform = espressif32@6.13.0
board = lolin32
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = !echo '-fno-exceptions -D AG_LOG_LEVEL=AG_LOG_LEVEL_INFO -D ARDUINOJSON_ENABLE_PROGMEM=0 -D AG_MODULAR_I2C=1 -D SPS30_ALWAYS_ON=1 -D SPS30_STARTUP_MS=8000 -D I2C_SDA_PIN=21 -D I2C_SCL_PIN=22 -D I2C_CLOCK_HZ=100000 -D WIRE_TIMEOUT_MS=200 -D GIT_VERSION=\\"'$(git describe --tags --always --dirty)'\\"'
lib_deps =
	aglib=symlink://${PROJECT_DIR}
	EEPROM
	WebServer
	ESPmDNS
	FS
	SPIFFS
	HTTPClient
	WiFiClientSecure
	Update
	DNSServer
	h2zero/NimBLE-Arduino@^2.1.0
	sensirion/Sensirion Core@^0.7.3
	sensirion/Sensirion UART SPS30@^1.0.0
	sensirion/Sensirion I2C SCD30@1.1.1
	sensirion/Sensirion I2C SCD4x@1.1.0
	sensirion/Sensirion I2C SPS30@1.0.0
	bblanchon/ArduinoJson@^7.4.3

[env:modular-lolin32]
extends = env:modular-esp32-d1mini

[env:modular-lolin32-lite]
extends = env:modular-esp32-d1mini

; Modular outdoor harness, variant B.
; Schematic: hardware/modular/variant-b-esp32s3-n16r8/ (rev C, 2026-11-26).
; ESP32-S3-DevKitC-1 class module N16R8: 16 MB quad SPI flash, 8 MB octal
; PSRAM (Espressif ESP32-S3-WROOM-1 datasheet). memory_type qio_opi matches
; that combination. GPIO35-37 (and 33-34) are not wired out to sensors.
; The board is USB-powered. Silkscreen 5V (VBUS) feeds the SPS30. Silkscreen
; 3V3 (onboard LDO) feeds the I2C modules. No SPS30 enable GPIO and no VBAT ADC.
; Pins: SDA GPIO8, SCL GPIO9. GPIO8/GPIO9 are the esp32s3 Arduino variant's
; default Wire pins.
; The stock devkitc-1 partition table in this repo is the 4 MB Open Air map;
; the rest of the 16 MB flash is left unused so the OTA layout stays put.
[env:modular-esp32s3-n16r8]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags = !echo '-fno-exceptions -D AG_LOG_LEVEL=AG_LOG_LEVEL_INFO -D ARDUINOJSON_ENABLE_PROGMEM=0 -D BOARD_HAS_PSRAM -D AG_MODULAR_I2C=1 -D SPS30_ALWAYS_ON=1 -D SPS30_STARTUP_MS=8000 -D I2C_SDA_PIN=8 -D I2C_SCL_PIN=9 -D I2C_CLOCK_HZ=100000 -D WIRE_TIMEOUT_MS=200 -D GIT_VERSION=\\"'$(git describe --tags --always --dirty)'\\"'
lib_deps =
	aglib=symlink://${PROJECT_DIR}
	EEPROM
	WebServer
	ESPmDNS
	FS
	SPIFFS
	HTTPClient
	WiFiClientSecure
	Update
	DNSServer
	h2zero/NimBLE-Arduino@^2.1.0
	sensirion/Sensirion Core@^0.7.3
	sensirion/Sensirion UART SPS30@^1.0.0
	sensirion/Sensirion I2C SCD30@1.1.1
	sensirion/Sensirion I2C SCD4x@1.1.0
	sensirion/Sensirion I2C SPS30@1.0.0
	bblanchon/ArduinoJson@^7.4.3

[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
	aglib=symlink://${PROJECT_DIR}
	EEPROM
	ESP8266HTTPClient
	ESP8266WebServer
	DNSServer
;
monitor_filters = time

